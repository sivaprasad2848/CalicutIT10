<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,ul,div,li,a{
            padding:0;
            margin: 0;
        }
        .nav{
            width:100%;
            min-height: 40px;
            background-color: blanchedalmond;
        }
        .nav ul{
            list-style-type: none;
            padding-top: 10px;
            float:right;
            margin-right:100px;
        }
        .nav ul li{
            display:inline;
            padding: 5px;;
        }
         .nav ul li a{
            text-decoration: none;
            text-transform: uppercase;
            padding: 10px;
         }
         .nav ul li a:hover{
            color:brown;
            background-color: yellow;
         }
    </style>
</head>
<body>
    <div class="nav">
    <ul>
        <li><a href="">Home</a></li>
        <li><a href="">AboutUs</a></li>
        <li><a href="">ContactUs</a></li>

    </ul>
    </div>

</html>
