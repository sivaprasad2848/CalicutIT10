    <style>
      .nav{
        width:100%;
        height:40px;
      }
      .nav ul{
        list-style-type: none;
      }
      .nav > ul > li{
        display: inline-block;
        position: relative;
      }
      .nav ul li a{
        text-decoration: none;
        padding:10px;
        display: block;
      }
      .submenu{
        display:none;
        position: absolute;
        top:100%;
        left:0;
        min-width: 200px;
        z-index: 10;
      }
      .parent:hover > .submenu{
        display:block;
      }
    </style>
</head>
<body>
    <div class="nav">
    <ul>
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>

            <a href="">Service &#9662;</a>

                <li><a href="">Printer</a></li>
                <li><a href="">Laptop</a></li>
                <li><a href="">Mobilephones</a></li>
                
            </ul>
        </li>
        <li class="parent">
            <a href="">Projects  &#9662;</a>
            <ul class="submenu">
                <li><a href="">Mobile Apps</a></li>
                <li><a href="">Web Apps</a></li>
                <li><a href="">Custom Application</a></li>
                <li><a href="">IoT</a></li>
            </ul>
        </li>
    </ul>
    </div>
</body>
</html>
